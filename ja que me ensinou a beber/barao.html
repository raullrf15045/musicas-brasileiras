<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Já Que Me Ensinou a Beber - Priscila Senna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }
    .player {
      width: 92%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      margin-top: 5px;
      opacity: 0.75;
      font-size: 0.95rem;
    }
    .lyrics {
      height: 340px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 16px;
    }
    .lyrics::-webkit-scrollbar { width: 5px; }
    .lyrics::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }
    .line {
      opacity: 0.3;
      transform: scale(0.96);
      transition: all 0.4s ease;
      margin: 12px 0;
      font-size: 1.15rem;
      text-align: center;
      line-height: 1.45;
    }
    .line.active {
      opacity: 1;
      transform: scale(1.04);
      color: #00d2ff;
      font-weight: 600;
      text-shadow: 0 0 16px rgba(0, 210, 255, 0.4);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 11px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.25s;
    }
    button:hover { background: rgba(255,255,255,0.2); }
    button.primary {
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      color: #0f172a;
      font-weight: 600;
    }
    audio {
      width: 100%;
      border-radius: 12px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="header">
      <h1>JÁ QUE ME ENSINOU A BEBER</h1>
      <p>Priscila Senna</p>
    </div>

    <div class="lyrics" id="lyrics"></div>

    <div class="controls">
      <button class="primary" onclick="tocar()">▶ Tocar</button>
      <button onclick="pausar()">Pausar</button>
      <button onclick="reiniciar()">Reiniciar</button>
    </div>

    <audio id="audio" src="musica.mp3" controls></audio>
  </div>

  <script>
    // Tempos baseados no áudio que você enviou
    const letra = [
      { tempo: 18, texto: "Eu prometi não mais te procurar" },
      { tempo: 21, texto: "Mas hoje não é meu dia de sorte" },
      { tempo: 25, texto: "Achei sua foto no meu celular" },
      { tempo: 28, texto: "Não te esqueci, me diz como é que pode?" },
      { tempo: 31, texto: "Cê me tirou do coração" },
      { tempo: 33, texto: "E eu não te tirei da mente" },
      { tempo: 35, texto: "O álcool não apaga" },
      { tempo: 38, texto: "A saudade da gente, amor, amor" },

      { tempo: 44, texto: "Já que me ensinou a beber" },
      { tempo: 47, texto: "Já que me ensinou a sofrer" },
      { tempo: 50, texto: "Me ensina, por favor" },
      { tempo: 53, texto: "Como é que faz pra te esquecer" },

      { tempo: 58, texto: "Já que me ensinou a beber" },
      { tempo: 61, texto: "Já que me ensinou a sofrer" },
      { tempo: 65, texto: "Me ensina, por favor" },
      { tempo: 68, texto: "Como é que faz pra te esquecer" },

      { tempo: 86, texto: "Eu prometi não mais te procurar" },
      { tempo: 89, texto: "Mas hoje não é meu dia de sorte" },
      { tempo: 93, texto: "Achei sua foto no meu celular" },
      { tempo: 96, texto: "Não te esqueci, me diz como é que pode?" },
      { tempo: 100, texto: "Cê me tirou do coração" },
      { tempo: 103, texto: "E eu não te tirei da mente" },
      { tempo: 106, texto: "O álcool não apaga" },
      { tempo: 109, texto: "A saudade da gente, amor, amor" },

      { tempo: 113, texto: "Já que me ensinou a beber" },
      { tempo: 116, texto: "Já que me ensinou a sofrer" },
      { tempo: 119, texto: "Me ensina, por favor" },
      { tempo: 122, texto: "Como é que faz pra te esquecer" },

      { tempo: 126, texto: "Já que me ensinou a beber" },
      { tempo: 129, texto: "Já que me ensinou a sofrer" },
      { tempo: 133, texto: "Me ensina, por favor" },
      { tempo: 136, texto: "Como é que faz pra te esquecer" }
    ];

    const container = document.getElementById("lyrics");
    const audio = document.getElementById("audio");
    let currentIndex = -1;

    // Cria as linhas
    letra.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "line";
      div.id = "line-" + i;
      div.textContent = item.texto;
      container.appendChild(div);
    });

    function atualizarLetra() {
      const tempoAtual = audio.currentTime;
      let novoIndex = -1;

      for (let i = 0; i < letra.length; i++) {
        if (tempoAtual >= letra[i].tempo) {
          novoIndex = i;
        } else {
          break;
        }
      }

      if (novoIndex !== currentIndex && novoIndex >= 0) {
        currentIndex = novoIndex;
        document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
        const linha = document.getElementById("line-" + currentIndex);
        if (linha) {
          linha.classList.add("active");
          linha.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    audio.addEventListener("timeupdate", atualizarLetra);

    function tocar() {
      audio.play();
    }

    function pausar() {
      audio.pause();
    }

    function reiniciar() {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = -1;
      document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
      container.scrollTop = 0;
    }
  </script>
</body>
</html>
