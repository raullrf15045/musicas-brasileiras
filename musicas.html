  <meta charset="UTF-8">

  <title>Player de Músicas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
      padding: 20px;
    }
    .player {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(to right, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      margin-top: 5px;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    .seletor {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .seletor button {
      flex: 1;
      min-width: 120px;
      padding: 10px 6px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.25s;
    }
    .seletor button.ativo {
      background: linear-gradient(to right, #ff6b6b, #feca57);
      color: #1a1a2e;
      font-weight: 600;
    }
    .lyrics {
      height: 340px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 14px;
    }
    .lyrics::-webkit-scrollbar { width: 5px; }
    .lyrics::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }
    .line {
      opacity: 0.3;
      transform: scale(0.96);
      transition: all 0.4s ease;
      margin: 11px 0;
      font-size: 1.1rem;
      text-align: center;
      line-height: 1.4;
    }
    .line.active {
      opacity: 1;
      transform: scale(1.04);
      color: #feca57;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(254, 202, 87, 0.4);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button.ctrl {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.25s;
    }
    button.ctrl:hover { background: rgba(255,255,255,0.2); }
    button.primary {
      background: linear-gradient(to right, #ff6b6b, #feca57);
      color: #1a1a2e;
      font-weight: 600;
    }
    audio {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>

    let musicaAtual = null;

    const audio = document.getElementById("audio");
    const container = document.getElementById("lyrics");

    function escolherMusica(num) {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = -1;
      document.querySelectorAll(".seletor button").forEach(btn => btn.classList.remove("ativo"));
      document.getElementById("btn" + num).classList.add("ativo");
      musicaAtual = musicas[num];
      document.getElementById("titulo").textContent = musicaAtual.titulo;
      document.getElementById("artista").textContent = musicaAtual.artista;
      audio.src = musicaAtual.arquivo;
      container.innerHTML = "";
      musicaAtual.letra.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "line";
        div.id = "line-" + i;
        div.textContent = item.texto;
        container.appendChild(div);
      });
    }

    function atualizarLetra() {
      if (!musicaAtual) return;
      const tempoAtual = audio.currentTime;
      let novoIndex = -1;
      for (let i = 0; i < musicaAtual.letra.length; i++) {
        if (tempoAtual >= musicaAtual.letra[i].tempo) {
          novoIndex = i;
        } else break;
      }
      if (novoIndex !== currentIndex && novoIndex >= 0) {
        currentIndex = novoIndex;
        document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
        const linha = document.getElementById("line-" + currentIndex);
        if (linha) {
          linha.classList.add("active");
          linha.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    audio.addEventListener("timeupdate", atualizarLetra);

    function tocar() {
      if (!musicaAtual) {
        alert("Escolhe uma música primeiro!");
        return;
      }
      audio.play();
    }

    function pausar() {
      audio.pause();
    }

    function reiniciar() {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = -1;
      document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
      container.scrollTop = 0;
    }
