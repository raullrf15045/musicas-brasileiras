<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Músicas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
      padding: 20px;
    }
    .player {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(to right, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      margin-top: 5px;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    .seletor {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .seletor button {
      flex: 1;
      min-width: 140px;
      padding: 11px 8px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.25s;
    }
    .seletor button.ativo {
      background: linear-gradient(to right, #ff6b6b, #feca57);
      color: #1a1a2e;
      font-weight: 600;
    }
    .lyrics {
      height: 340px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 14px;
    }
    .lyrics::-webkit-scrollbar { width: 5px; }
    .lyrics::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }
    .line {
      opacity: 0.3;
      transform: scale(0.96);
      transition: all 0.4s ease;
      margin: 11px 0;
      font-size: 1.1rem;
      text-align: center;
      line-height: 1.4;
    }
    .line.active {
      opacity: 1;
      transform: scale(1.04);
      color: #feca57;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(254, 202, 87, 0.4);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button.ctrl {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.25s;
    }
    button.ctrl:hover { background: rgba(255,255,255,0.2); }
    button.primary {
      background: linear-gradient(to right, #ff6b6b, #feca57);
      color: #1a1a2e;
      font-weight: 600;
    }
    audio {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="header">
      <h1 id="titulo">Escolha a música</h1>
      <p id="artista">-</p>
    </div>

    <div class="seletor">
      <button id="btn1" onclick="escolherMusica(1)">Até Que Durou</button>
      <button id="btn2" onclick="escolherMusica(2)">Já Que Me Ensinou</button>
      <button id="btn3" onclick="escolherMusica(3)">AK-47</button>
    </div>

    <div class="lyrics" id="lyrics"></div>

    <div class="controls">
      <button class="ctrl primary" onclick="tocar()">▶ Tocar</button>
      <button class="ctrl" onclick="pausar()">Pausar</button>
      <button class="ctrl" onclick="reiniciar()">Reiniciar</button>
    </div>

    <audio id="audio" controls></audio>
  </div>

  <script>

          { tempo: 31, texto: "Tentei ser um cara perfeito" },
          { tempo: 35, texto: "Eu fiz as coisas do seu jeito" },
          { tempo: 40, texto: "Queria ser mais importante" },
          { tempo: 43, texto: "Mas não fui pra você" },
          { tempo: 46, texto: "Até que durou..." },
          { tempo: 49, texto: "Me diz o porquê" },

          { tempo: 55, texto: "Te faço um favor" },

          { tempo: 59, texto: "Fui mais um nas suas mãos" },
          { tempo: 63, texto: "Não sei se por carência ou falta de opção" },
          { tempo: 68, texto: "Só sei que eu senti amor" },
          { tempo: 71, texto: "Que pena, só eu senti amor" },
          { tempo: 74, texto: "O que faço com os planos" },
          { tempo: 77, texto: "Dos próximos anos?" },
          { tempo: 80, texto: "Juro que não sei" },
          { tempo: 83, texto: "Só sei que eu senti amor" },
          { tempo: 86, texto: "Que pena, só eu senti amor" }
        ]
      },
      2: {
        titulo: "JÁ QUE ME ENSINOU A BEBER",
        artista: "Priscila Senna",
        arquivo: "priscila.mp3",
        letra: [
          { tempo: 18, texto: "Eu prometi não mais te procurar" },
          { tempo: 21, texto: "Mas hoje não é meu dia de sorte" },
          { tempo: 25, texto: "Achei sua foto no meu celular" },
          { tempo: 28, texto: "Não te esqueci, me diz como é que pode?" },
          { tempo: 31, texto: "Cê me tirou do coração" },
          { tempo: 33, texto: "E eu não te tirei da mente" },
          { tempo: 35, texto: "O álcool não apaga" },
          { tempo: 38, texto: "A saudade da gente, amor, amor" },
          { tempo: 44, texto: "Já que me ensinou a beber" },
          { tempo: 47, texto: "Já que me ensinou a sofrer" },
          { tempo: 50, texto: "Me ensina, por favor" },
          { tempo: 53, texto: "Como é que faz pra te esquecer" },
          { tempo: 58, texto: "Já que me ensinou a beber" },
          { tempo: 61, texto: "Já que me ensinou a sofrer" },
          { tempo: 65, texto: "Me ensina, por favor" },
          { tempo: 68, texto: "Como é que faz pra te esquecer" },
          { tempo: 86, texto: "Eu prometi não mais te procurar" },
          { tempo: 89, texto: "Mas hoje não é meu dia de sorte" },
          { tempo: 93, texto: "Achei sua foto no meu celular" },
          { tempo: 96, texto: "Não te esqueci, me diz como é que pode?" },
          { tempo: 100, texto: "Cê me tirou do coração" },
          { tempo: 103, texto: "E eu não te tirei da mente" },
          { tempo: 106, texto: "O álcool não apaga" },
          { tempo: 109, texto: "A saudade da gente, amor, amor" },
          { tempo: 113, texto: "Já que me ensinou a beber" },
          { tempo: 116, texto: "Já que me ensinou a sofrer" },
          { tempo: 119, texto: "Me ensina, por favor" },
          { tempo: 122, texto: "Como é que faz pra te esquecer" }
        ]
      },
      3: {
        titulo: "AK-47",
        artista: "RT / MK",
        arquivo: "ak47.mp3",
        letra: [
          { tempo: 2, texto: "Mais um AD, né?" },
          { tempo: 5, texto: "O RT num beat, MK na voz" },
          { tempo: 14, texto: "Já sofri muito bully no tempo da escola" },
          { tempo: 18, texto: "Agora tudo mudou, eu passo recolhendo a nota" },
          { tempo: 21, texto: "Maloqueiro chique, é disso que ela gosta" },
          { tempo: 24, texto: "É camarada, eu ando com o pente pra fora" },
          { tempo: 61, texto: "As piranha trepa, trepa, trepa, trepa" },
          { tempo: 65, texto: "As piranha trepa, trepa, trepa" },
          { tempo: 69, texto: "As piranha trepa, trepa, trepa" },
          { tempo: 73, texto: "As piranha trepa, trepa, trepa" },
          { tempo: 76, texto: "AK 47 é o porte do homem" },
          { tempo: 79, texto: "É o porte do homem, é o porte do homem" },
          { tempo: 81, texto: "Mais uma dele né, o RT no beat, MK na voz" },
          { tempo: 95, texto: "Já sofri muito bully no tempo da escola" },
          { tempo: 99, texto: "Agora tudo mudou, eu passo recolhendo a nota" },
          { tempo: 103, texto: "Maloqueiro chique, é disso que ela gosta" },
          { tempo: 106, texto: "É camarada, eu ando com o pente pra fora" }
        ]
      }
    };

    let musicaAtual = null;
    let currentIndex = -1;
    const audio = document.getElementById("audio");
    const container = document.getElementById("lyrics");

    function escolherMusica(num) {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = -1;

      document.querySelectorAll(".seletor button").forEach(btn => btn.classList.remove("ativo"));
      document.getElementById("btn" + num).classList.add("ativo");

      musicaAtual = musicas[num];
      document.getElementById("titulo").textContent = musicaAtual.titulo;
      document.getElementById("artista").textContent = musicaAtual.artista;
      audio.src = musicaAtual.arquivo;

      container.innerHTML = "";
      musicaAtual.letra.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "line";
        div.id = "line-" + i;
        div.textContent = item.texto;
        container.appendChild(div);
      });
    }

    function atualizarLetra() {
      if (!musicaAtual) return;
      const tempoAtual = audio.currentTime;
      let novoIndex = -1;

      for (let i = 0; i < musicaAtual.letra.length; i++) {
        if (tempoAtual >= musicaAtual.letra[i].tempo) {
          novoIndex = i;
        } else break;
      }

      if (novoIndex !== currentIndex && novoIndex >= 0) {
        currentIndex = novoIndex;
        document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
        const linha = document.getElementById("line-" + currentIndex);
        if (linha) {
          linha.classList.add("active");
          linha.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    audio.addEventListener("timeupdate", atualizarLetra);

    function tocar() {
      if (!musicaAtual) {
        alert("Escolhe uma música primeiro!");
        return;
      }
      audio.play();
    }

    function pausar() {
      audio.pause();
    }

    function reiniciar() {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = -1;
      document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
      container.scrollTop = 0;
    }
  </script>
</body>
</html>
